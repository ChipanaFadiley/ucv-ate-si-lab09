# Flujo de trabajo de Integración Continua (CI) en GitHub Actions.
name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar el entorno de Python 3.11.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalar Poetry.
      - name: Install Poetry
        run: pip install poetry

      # 4. Instalar las dependencias del proyecto.
      - name: Install dependencies
        run: poetry install

      # 5. Ejecutar Ruff para validación estática de código.
      - name: Run Ruff
        run: poetry run ruff check .

      # 6. Ejecutar pruebas unitarias con reporte de cobertura para SonarQube.
      - name: Run Pytest with coverage
        run: poetry run pytest --cov=travel_assistant --cov-report=term-missing --cov-report=xml

      # 7. Ejecutar escaneo de SonarQube/SonarCloud.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
